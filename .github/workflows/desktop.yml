name: Build Desktop Binaries (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: syncMyShit-linux-x64
            binary_path: dist/syncMyShit
            target_name: syncMyShit-linux-x64
          - os: windows-latest
            artifact_name: syncMyShit-windows-x64.exe
            binary_path: dist/syncMyShit.exe
            target_name: syncMyShit-windows-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil rich

      - name: Build Standalone Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile --name syncMyShit desktop/main.py
          mkdir -p release-desktop
          cp "${{ matrix.binary_path }}" "release-desktop/${{ matrix.target_name }}"

          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            chmod +x "release-desktop/${{ matrix.target_name }}"
            mkdir -p package-linux
            cp dist/syncMyShit package-linux/
            chmod +x package-linux/syncMyShit
            cp install.sh package-linux/
            chmod +x package-linux/install.sh
            cp syncMyShit.desktop package-linux/
            cp desktop/README.md package-linux/
            tar -czf release-desktop/syncMyShit-linux-x64.tar.gz -C package-linux .
          else
            mkdir -p package-windows
            cp dist/syncMyShit.exe package-windows/
            cp desktop/README.md package-windows/
            7z a release-desktop/syncMyShit-windows-x64.zip ./package-windows/*
          fi

          ls -la release-desktop/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-desktop/*

      - name: Attach Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-desktop/*
