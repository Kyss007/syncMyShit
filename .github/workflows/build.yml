name: Build & Test syncMyShit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --no-daemon 2>&1 | tee test_log.log

      - name: Dump Test Log on Failure
        if: failure()
        run: |
          echo "=== TEST FAILED: LOG DUMP ==="
          tail -n 250 test_log.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-debug-log || git checkout -B ci-debug-log
          git rm -rf . || true
          cp test_log.log build-failure.log
          git add build-failure.log
          git commit -m "ci: capture test failure log"
          git push -f origin ci-debug-log || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.log

      - name: Dump Build Log on Failure
        if: failure()
        run: |
          echo "=== BUILD FAILED: LOG DUMP ==="
          tail -n 250 build_log.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncMyShit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
