name: Release Build APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        id: prep
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/syncMyShit-${TAG}.apk"
          ls -la release-artifacts/

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "syncMyShit Release ${{ steps.prep.outputs.release_tag }}"
          tag_name: ${{ steps.prep.outputs.release_tag }}
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎮 syncMyShit Release ${{ steps.prep.outputs.release_tag }}
            
            Automagic save file cloud sync for Android retro emulation handhelds.
            
            #### 📥 Direct Download:
            - **[syncMyShit-${{ steps.prep.outputs.release_tag }}.apk](https://github.com/Kyss007/syncMyShit/releases/download/${{ steps.prep.outputs.release_tag }}/syncMyShit-${{ steps.prep.outputs.release_tag }}.apk)** (Ready to install)
            
            #### 🌟 Highlights:
            - **Pre-Play & Post-Play Automagic Sync**: Checks Google Drive before you play, uploads save files right after you quit.
            - **Full Scoped Storage Support**: Works seamlessly with **DraStic**, **Dolphin**, **AetherSX2**, and any emulator inside `Android/data/` using SAF and Shizuku.
            - **All CocoonFE Emulators & Systems Supported**: Over 125 platforms and 140+ emulator package variants pre-configured out of the box (RetroArch, PPSSPP, Dolphin, DuckStation, Vita3K, Yuzu/Suyu/Sudachi, DraStic, Broglia suite, recomps, ports, etc.).
            - **Custom Paths**: Add any directory, recomp, or standalone game directly in the app.
            - **Zero Save-Loss Protection**: Timestamped local backups (`.syncmyshit_backups/`) and cloud snapshots (`syncMyShit/_backups/`) prevent lost progress.
            - **100% Free & Dedicated to the Public Domain** (The Unlicense).

      - name: Upload Artifact (for workflow_dispatch or PRs)
        uses: actions/upload-artifact@v4
        with:
          name: syncMyShit-prebuilt-apk
          path: release-artifacts/*.apk
