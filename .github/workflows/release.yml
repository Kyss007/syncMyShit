name: Release Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v1.0.0"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/syncMyShit-${TAG_NAME}.apk
          ls -la release-artifacts/

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "syncMyShit Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎮 syncMyShit Release ${{ github.ref_name }}
            
            Automagic save file cloud sync for Android retro emulation handhelds.
            
            #### 📥 Direct Download:
            - **[syncMyShit-${{ github.ref_name }}.apk](../../releases/download/${{ github.ref_name }}/syncMyShit-${{ github.ref_name }}.apk)** (Ready to install)
            
            #### 🌟 Highlights:
            - **Pre-Play & Post-Play Automagic Sync**: Checks Google Drive before you play, uploads save files right after you quit.
            - **Full Scoped Storage Support**: Works seamlessly with **DraStic**, **Dolphin**, **AetherSX2**, and any emulator inside `Android/data/` using SAF and Shizuku.
            - **20+ Systems & Recomps Pre-configured**: RetroArch, PPSSPP, Dolphin, DuckStation, Vita3K, Yuzu/Suyu, Zelda 64 Recompiled, Ship of Harkinian, SM64, Balatro, PortMaster, and more.
            - **Custom Paths**: Add any directory or standalone game directly in the app.
            - **Zero Save-Loss Protection**: Timestamped local backups (`.syncmyshit_backups/`) and cloud snapshots (`syncMyShit/_backups/`) prevent lost progress.
            - **100% Free & Dedicated to the Public Domain** (The Unlicense).

      - name: Upload Artifact (for workflow_dispatch or PRs)
        uses: actions/upload-artifact@v4
        with:
          name: syncMyShit-prebuilt-apk
          path: release-artifacts/*.apk
